# Traceback eval questions (CONTRACTS.md section 11). Owned by the testing session.
#
# Every expectation below was checked by hand with SQL against the store built from the committed sample
# (tbx ingest data/sample/aleapp + tbx enrich --offline) on Nov 3, 2026. Case timezone: America/New_York
# (EST until 2024-03-10, EDT after). Windows are case-local and inclusive.
#
# - expected_entities: phones as digits, coordinates as "lat,lon" (matched within 1e-4), anything else as a
#   case-insensitive substring of the verified claims' text or cited values.
# - expected_artifact_ids: the rows a complete answer must cite.
# - tags: "negative" means the extraction holds no answer, so the right output is zero verified claims.
#   "trap-*" marks questions built to tempt a model into a specific mistake (time zones, voicemail vs missed,
#   near-miss numbers, empty windows). "completeness" means every listed row is needed.
# - truth: what SQL says, for the reader.

- id: q01
  question: "Where was this phone between 9 and 11 pm, and who did it talk to?"
  window: {from: "2024-06-27 21:00", to: "2024-06-27 23:00"}
  expected_entities: ["8442008341", "35.6596081,-78.8730535"]
  expected_artifact_ids: [msg_c9a0e4d555]
  tags: [locations, messages, flagship, trap-tz-boundary]
  truth: "73 location points, all at 35.6596081,-78.8730535. No calls. One incoming MMS from (844) 200-8341 at 10:41:52 PM (Jun 28 in UTC), 'Team DLCC: President Biden and Trump just left the stage.', stored as two rows plus an image."

